<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Grand Élite</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0b0b0b;
    color: #eee;
}

/* HEADER */
header {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url('https://images.unsplash.com/photo-1555992336-03a23c0a0f6c') center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    animation: fadeIn 2s ease-in;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 90px;
    color: gold;
    margin: 0;
}

header p {
    font-size: 22px;
}

.btn {
    margin-top: 25px;
    padding: 12px 35px;
    border: 1px solid gold;
    color: gold;
    text-decoration: none;
}

.btn:hover {
    background: gold;
    color: black;
}

/* NAV */
nav {
    background: black;
    text-align: center;
    padding: 15px;
    position: sticky;
    top: 0;
}

nav a {
    color: gold;
    margin: 0 20px;
    text-decoration: none;
}

/* SECCIONES */
section {
    padding: 90px 20px;
    max-width: 1100px;
    margin: auto;
}

h2 {
    font-family: 'Playfair Display', serif;
    color: gold;
    text-align: center;
}

/* MENÚ */
.menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: #111;
    border: 1px solid gold;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
}

.card:hover {
    box-shadow: 0 0 15px gold;
}

/* GALERÍA */
.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.galeria img {
    width: 100%;
    border-radius: 10px;
}

/* FORM */
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 500px;
    margin: auto;
}

input, textarea {
    padding: 12px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 12px;
    background: gold;
    border: none;
    cursor: pointer;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px;
    border-radius: 50%;
    font-size: 20px;
    text-decoration: none;
}

/* FOOTER */
footer {
    background: black;
    color: gold;
    text-align: center;
    padding: 20px;
}

/* ANIMACIÓN */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<header>
    <h1 class="logo">Le Grand Élite</h1>
    <p>Alta cocina • Experiencia exclusiva</p>
    <a href="#reservas" class="btn">Reservar mesa</a>
</header>

<nav>
    <a href="#inicio">Inicio</a>
    <a href="#menu">Menú</a>
    <a href="#galeria">Galería</a>
    <a href="#reservas">Reservas</a>
</nav>

<section id="inicio">
    <h2>Bienvenido</h2>
    <p style="text-align:center;">
        Donde la gastronomía se convierte en arte.
    </p>
</section>

<section id="menu">
    <h2>Menú Gourmet</h2>
    <div class="menu">
        <div class="card">🥩 Wagyu — $850</div>
        <div class="card">🦞 Langosta — $920</div>
        <div class="card">🍝 Trufa — $480</div>
        <div class="card">🍷 Vinos — $350</div>
    </div>
</section>

<section id="galeria">
    <h2>Galería</h2>
    <div class="galeria">
        <img src="https://images.unsplash.com/photo-1555992336-03a23c0a0f6c">
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0">
    </div>
</section>

<section id="reservas">
    <h2>Reservar</h2>
    <form>
        <input type="text" placeholder="Nombre" required>
        <input type="email" placeholder="Correo" required>
        <input type="date" required>
        <input type="time" required>
        <button>Reservar</button>
    </form>
</section>

<!-- MAPA -->
<section>
    <h2>Ubicación</h2>
    <iframe src="https://maps.google.com/maps?q=queretaro&t=&z=13&ie=UTF8&iwloc=&output=embed"
    width="100%" height="300" style="border:0;"></iframe>
</section>

<a href="https://wa.me/524421234567" class="whatsapp">💬</a>

<footer>
    <p>© 2026 Le Grand Élite</p>
</footer>

</body>
</html>
